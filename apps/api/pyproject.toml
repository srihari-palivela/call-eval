[project]
name = "calleval-api"
version = "1.0.0"
description = "Call evaluation API: provider connectors, evaluation pipeline, analytics and recommendations."
requires-python = ">=3.12"
dependencies = [
  "anthropic==2.3.0",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  # Embedded PostgreSQL for development; it has no Linux ARM wheel, where the system's PostgreSQL is used instead.
  "pgserver==0.1.4; sys_platform == 'darwin' or sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "psycopg[binary,pool]==3.3.6",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[project.scripts]
calleval = "calleval.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calleval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
